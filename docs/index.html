<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Ryan的技术笔记</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Ryan | 全栈实践与思考，记录技术变现之路">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- 可选：进度条样式 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-progress@latest/dist/style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      // 基础信息
      name: 'Ryan的技术笔记',
      repo: 'CommitByRyan/CommitByRyan.github.io',
      
      // 核心：侧边栏配置
      loadSidebar: true,       // 必须：启用自定义侧边栏
      alias: {                // 可选：设置侧边栏文件别名，确保路径正确
        '/_sidebar.md': '/_sidebar.md'
      },
      
      // 导航与目录
      subMaxLevel: 3,          // 推荐：展开到3级标题，方便长文导航
      sidebarDisplayLevel: 1,  // 推荐：自动展开一级侧边栏
      auto2top: true,          // 推荐：切换页面时自动滚动到顶部
      
      // 搜索功能（强烈推荐）
      search: {
        placeholder: '搜索文章...',
        noData: '找不到相关文章',
        depth: 3
      },
      
      // 页面增强
      coverpage: false,        // 暂时关闭封面页，如需启用可设为 true 或创建 _coverpage.md
      notFoundPage: '_404.md', // 启用自定义404页面（可在docs目录创建此文件）
      
      // 插件功能
      pagination: {            // 文章底部显示“上一篇/下一篇”
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      
      // 主题与样式
      themeColor: '#42b983'    // 可调整为主题色
    }
  </script>
  
  <!-- Docsify 核心库 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- 插件：搜索（必须与配置search一同使用） -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- 插件：代码高亮（提升代码展示效果） -->
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
  
  <!-- 插件：字数统计与阅读时间 -->
  <script src="//unpkg.com/docsify-count/dist/countable.min.js"></script>
  
  <!-- 插件：页面进度条（顶部加载条） -->
  <script src="//cdn.jsdelivr.net/npm/docsify-progress@latest/dist/index.js"></script>
</body>
</html>
